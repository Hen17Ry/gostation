# Captures de chaque écran (npm run screenshots) : THEME = light | dark, réglé par le script.
appId: bj.gostation.app
---
- launchApp:
    clearState: true
    permissions:
      location: allow
- setLocation:
    latitude: 6.3654
    longitude: 2.4183
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 01-onboarding-what-${THEME}
- tapOn:
    id: onboarding-next
- waitForAnimationToEnd
- takeScreenshot: 02-onboarding-location-${THEME}
- tapOn:
    id: onboarding-allow-location
- waitForAnimationToEnd
- takeScreenshot: 03-onboarding-no-account-${THEME}
- tapOn:
    id: onboarding-start
- extendedWaitUntil:
    visible:
      id: search-submit
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-home-${THEME}
- tapOn:
    id: kind-lpg
- tapOn:
    id: size-lpg_10kg
- tapOn:
    id: search-submit
- extendedWaitUntil:
    visible:
      id: result-1
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-results-${THEME}
# Geste parti du résumé (qui ne défile pas) : le panneau s'ouvre sans faire défiler la liste.
- swipe:
    start: 30%, 46%
    end: 30%, 8%
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: 07-results-expanded-${THEME}
- tapOn:
    id: result-1
- extendedWaitUntil:
    visible:
      id: station-route
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 08-station-${THEME}
- scroll
- takeScreenshot: 09-station-hours-${THEME}
- tapOn:
    id: station-route
- extendedWaitUntil:
    visible:
      id: route-start
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 10-route-preview-${THEME}
- tapOn:
    id: route-start
- extendedWaitUntil:
    visible:
      id: route-stop
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 11-navigation-${THEME}
- tapOn:
    id: route-stop
- back
- tapOn:
    id: station-report
- waitForAnimationToEnd
- takeScreenshot: 12-sign-in-required-${THEME}
- back
- back
- tapOn:
    id: tab-favorites
- waitForAnimationToEnd
- takeScreenshot: 13-favorites-guest-${THEME}
- tapOn:
    id: tab-account
- waitForAnimationToEnd
- takeScreenshot: 14-account-guest-${THEME}
- tapOn:
    id: account-sign-up
- waitForAnimationToEnd
- takeScreenshot: 15-sign-up-${THEME}
- runScript:
    file: ../scripts/new-email.js
- tapOn:
    id: sign-up-first-name
- inputText: Ama
- tapOn:
    id: sign-up-last-name
- inputText: Kossou
- tapOn:
    id: sign-up-email
- inputText: ${output.email}
# Sur un téléphone (police agrandie, clavier haut), le champ peut être sous le clavier.
- hideKeyboard
- scrollUntilVisible:
    element:
      id: sign-up-password
    direction: DOWN
- tapOn:
    id: sign-up-password
- inputText: Cotonou-Fidjrosse-2026
- hideKeyboard
- scrollUntilVisible:
    element:
      id: sign-up-policy
    direction: DOWN
- tapOn:
    id: sign-up-policy
- tapOn:
    id: sign-up-submit
- extendedWaitUntil:
    visible: Vérifiez votre email
    timeout: 15000
- hideKeyboard
- takeScreenshot: 16-verify-code-${THEME}
- runScript:
    file: ../scripts/mail-code.js
    env:
      EMAIL: ${output.email}
- inputText: ${output.code}
- extendedWaitUntil:
    visible: Ama Kossou
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 17-account-${THEME}
- tapOn:
    id: tab-index
- tapOn:
    id: result-1
- extendedWaitUntil:
    visible:
      id: station-favorite
    timeout: 10000
- tapOn:
    id: station-favorite
- extendedWaitUntil:
    visible: Ajoutée aux favoris
    timeout: 10000
- takeScreenshot: 18-favorite-added-${THEME}
- tapOn:
    id: station-report
- waitForAnimationToEnd
- takeScreenshot: 19-report-${THEME}
- back
- back
- tapOn:
    id: tab-favorites
- waitForAnimationToEnd
- takeScreenshot: 20-favorites-${THEME}
- tapOn: .*Alertes.*
- waitForAnimationToEnd
- takeScreenshot: 21-favorite-alerts-${THEME}
- back
- tapOn:
    id: tab-inbox
- waitForAnimationToEnd
- takeScreenshot: 22-inbox-${THEME}
- tapOn:
    id: tab-account
- scrollUntilVisible:
    element: Préférences de notification
    direction: DOWN
- tapOn: Préférences de notification
- waitForAnimationToEnd
- takeScreenshot: 23-notification-settings-${THEME}
- back
- scrollUntilVisible:
    element: Politique de confidentialité
    direction: DOWN
- tapOn: Politique de confidentialité
- waitForAnimationToEnd
- takeScreenshot: 24-privacy-draft-${THEME}
- back
- scrollUntilVisible:
    element: Appareils connectés
    direction: UP
- tapOn: Appareils connectés
- waitForAnimationToEnd
- takeScreenshot: 25-sessions-${THEME}
- back
- tapOn:
    id: tab-index
- setLocation:
    latitude: 48.8566
    longitude: 2.3522
    optional: true
- tapOn:
    id: search-edit
- tapOn:
    id: search-submit
- extendedWaitUntil:
    visible:
      id: coverage-pick
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 26-out-of-coverage-${THEME}
