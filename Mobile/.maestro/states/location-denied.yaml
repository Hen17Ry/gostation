# Localisation refusée, puis point de recherche choisi sur la carte.
appId: bj.gostation.app
---
- launchApp:
    clearState: true
    permissions:
      location: deny
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-later
- tapOn:
    id: onboarding-start
- extendedWaitUntil:
    visible: Localisation désactivée
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 30-location-denied-${THEME}
- tapOn:
    point: 50%,30%
- extendedWaitUntil:
    visible: Point de recherche choisi
    timeout: 10000
- tapOn:
    id: kind-lpg
- tapOn:
    id: size-lpg_10kg
- tapOn:
    id: search-submit
- extendedWaitUntil:
    visible:
      id: result-1
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 31-manual-point-results-${THEME}
