# Compte : changement de mot de passe, déconnexion, mot de passe oublié (code Mailpit),
# reconnexion avec le nouveau mot de passe, suppression du compte.
appId: bj.gostation.app
name: Gestion du compte
---
- runFlow: common/start.yaml
- runFlow: common/sign-up.yaml
- tapOn:
    id: tab-account
- scrollUntilVisible:
    element:
      id: account-password
- tapOn:
    id: account-password
- tapOn:
    id: current-password
- inputText: Cotonou-Fidjrosse-2026
- tapOn:
    id: new-password
- inputText: Ganvie-Lagune-2027
- hideKeyboard
- tapOn:
    id: password-submit
- extendedWaitUntil:
    visible: Mot de passe changé
    timeout: 10000
- scrollUntilVisible:
    element:
      id: account-sign-out
- tapOn:
    id: account-sign-out
- extendedWaitUntil:
    visible:
      id: account-sign-in
    timeout: 10000
- tapOn:
    id: account-sign-in
- tapOn: Mot de passe oublié ?
- tapOn:
    id: forgot-email
- inputText: ${output.email}
- hideKeyboard
- tapOn:
    id: forgot-submit
- extendedWaitUntil:
    visible: Nouveau mot de passe
    timeout: 10000
- runScript:
    file: scripts/mail-code.js
    env:
      EMAIL: ${output.email}
      SUBJECT: Réinitialisation
- inputText: ${output.code}
- tapOn:
    id: reset-password
- inputText: Porto-Novo-Ouidah-2028
- hideKeyboard
- tapOn:
    id: reset-submit
- extendedWaitUntil:
    visible: Mot de passe changé. Connectez-vous.
    timeout: 10000
- tapOn:
    id: sign-in-email
- inputText: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: Porto-Novo-Ouidah-2028
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible: Ama Kossou
    timeout: 15000
- scrollUntilVisible:
    element:
      id: account-delete
- tapOn:
    id: account-delete
- tapOn:
    id: delete-password
- inputText: Porto-Novo-Ouidah-2028
- hideKeyboard
- tapOn:
    id: delete-submit
- extendedWaitUntil:
    visible:
      id: account-sign-up
    timeout: 15000
