openapi: 3.1.0
info:
  title: GoStation API
  version: 0.5.0
  summary: Trouver la station la plus proche qui a le produit recherché en stock (Bénin).
  description: |
    API REST de GoStation. Source des types générés pour les clients mobile (Expo) et web (admin).

    - Toutes les routes métier sont sous `/api/v1`, en JSON (`camelCase`), dates RFC 3339 UTC.
    - Erreurs en `application/problem+json` (RFC 9457) avec un `code` stable : les clients
      s'appuient sur ce code, jamais sur `title`/`detail` (anglais, pour les développeurs).
    - Authentification : `Authorization: Bearer <accessToken>` (mobile) ; l'admin web utilise des
      cookies httpOnly et doit renvoyer le jeton CSRF dans `X-CSRF-Token` sur les requêtes non GET.
    - Access token : JWT EdDSA (Ed25519) de 15 min, clés publiques sur `/.well-known/jwks.json`.
      Refresh token opaque, renouvelé à chaque usage ; réutiliser un ancien token révoque la session.
      Les clients doivent sérialiser leurs appels à `/auth/refresh` (un seul à la fois).
    - Chaque réponse porte `X-Request-ID` ; les routes `/api/v1` portent `RateLimit-*`.
    - L'app mobile envoie `X-Install-Id` (UUID généré au premier lancement) sur la recherche et
      l'itinéraire : il sert uniquement aux quotas.
    - Confidentialité : les positions reçues (`lat`, `lng`) ne sont jamais stockées ni journalisées.

    Cette spec est vérifiée par un test : elle liste exactement les routes servies par l'API.
servers:
  - url: http://127.0.0.1:8080
    description: Développement local
tags:
  - name: health
    description: Sondes d'infrastructure
  - name: catalog
    description: Catalogue des produits
  - name: search
    description: Recherche de stations, fiche publique et itinéraire (publics, connexion facultative)
  - name: auth
    description: Inscription, vérification de l'email, connexion et sessions (utilisateurs et gérants)
  - name: admin-auth
    description: Connexion admin en deux étapes (mot de passe puis TOTP), cookies de session
  - name: me
    description: Compte de l'utilisateur authentifié
  - name: manager
    description: Espace gérant (station approuvée uniquement)
  - name: admin
    description: Back-office (session admin ouverte après 2FA)

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Le processus répond
      security: []
      responses:
        "200":
          description: Vivant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Liveness" }
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Les dépendances (PostgreSQL, Redis, OSRM) répondent
      security: []
      responses:
        "200":
          description: Prêt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Une dépendance est indisponible ou l'arrêt est en cours (extension `checks`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /.well-known/jwks.json:
    get:
      tags: [auth]
      operationId: getJWKS
      summary: Clés publiques de vérification des access tokens (RFC 7517, OKP/Ed25519)
      security: []
      responses:
        "200":
          description: Jeu de clés
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JWKS" }

  /api/v1/products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: Produits actifs, dans l'ordre d'affichage
      security: []
      responses:
        "200":
          description: Catalogue (cache client 5 min)
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/search:
    get:
      tags: [search]
      operationId: searchStations
      summary: Stations les plus proches ayant le produit en stock
      description: |
        Rayons progressifs (500 m → 50 km) sur les stations approuvées, avec horaires, ouvertes, en
        stock (> 0) et à jour (< 24 h) ; arrêt dès `SEARCH_MIN_RESULTS` stations. Rien d'ouvert à
        50 km : repli (`strategy = fallback`) sur les ouvertes plus loin et les fermées, triées par
        heure à laquelle on peut être servi (`servedAt`), puis par trajet. Les 10 meilleures sont
        classées par temps de trajet OSRM depuis la position exacte (jamais mise en cache).

        Couverture : au Bénin → trajets OSRM ; hors du Bénin à 30 km ou moins de la frontière, ou
        OSRM indisponible → vol d'oiseau et durées estimées (`routingApproximate = true`) ;
        au-delà → 422 `search.out_of_coverage`.

        Quotas : 300/min par IP et 30/min par installation (`X-Install-Id`) ou par utilisateur
        connecté ; sans `X-Install-Id`, le second quota s'applique à l'IP.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: product_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - $ref: "#/components/parameters/InstallId"
      responses:
        "200":
          description: Résultats (éventuellement vides, `strategy = none`)
          headers:
            X-Cache: { description: "HIT si l'ensemble des candidats venait du cache (cellule H3 res 8 + produit, 60 s), sinon MISS", schema: { type: string, enum: [HIT, MISS] } }
            Server-Timing: { description: "Durées db, osrm et total (ms)", schema: { type: string } }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "422":
          description: "Paramètres invalides (`request.validation_failed`) ou position hors couverture (`search.out_of_coverage`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/stations/{id}:
    get:
      tags: [search]
      operationId: getPublicStation
      summary: Fiche publique d'une station approuvée
      description: Infos, horaires et fermetures à venir, stocks des produits vendus avec leur fraîcheur. Station non approuvée → 404.
      security: []
      parameters:
        - $ref: "#/components/parameters/StationId"
      responses:
        "200":
          description: Fiche
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicStation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/routes:
    get:
      tags: [search]
      operationId: getRoute
      summary: Itinéraire vers une station
      description: |
        OSRM `route` (polyline6, `overview=full`, `steps=true`). Les étapes sont structurées et sans
        texte : le mobile les traduit en français avec `osrm-text-instructions` (langue `fr`).
        Position hors du Bénin → 422 `search.out_of_coverage` ; aucun itinéraire routier → 422
        `routing.no_route` ; OSRM indisponible → 503 `routing.unavailable` (le mobile peut alors
        proposer l'ouverture d'une app de navigation externe).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: station_id, in: query, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/InstallId"
      responses:
        "200":
          description: Itinéraire
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Route" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "Paramètres invalides, position hors couverture ou aucun itinéraire (`routing.no_route`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Routage indisponible (`routing.unavailable`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Inscription d'un utilisateur (10 par heure et par IP)
      description: Envoie un code de vérification par email et ouvre une session (un compte non vérifié peut se connecter).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Compte créé, session ouverte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/register/manager:
    post:
      tags: [auth]
      operationId: registerManager
      summary: Inscription d'un gérant et de sa station (statut pending)
      description: |
        Formulaire multipart. Le justificatif (PDF, JPEG ou PNG, 5 Mo max) est contrôlé par ses
        magic bytes, débarrassé de ses métadonnées (images) et chiffré ; il n'est jamais servi
        publiquement. Le dossier n'apparaît chez l'admin qu'une fois l'email vérifié.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ManagerRegistration" }
            encoding:
              document:
                contentType: application/pdf, image/jpeg, image/png
      responses:
        "201":
          description: Compte et station créés, session ouverte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Consomme le code de vérification à 6 chiffres
      description: Code valable 15 min, 5 essais. Email inconnu ou code faux → même réponse `auth.invalid_code`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "204": { description: Email vérifié }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Renvoie le code de vérification (1 par minute, 5 par heure)
      description: Réponse identique que le compte existe ou non.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Connexion d'un utilisateur ou d'un gérant (5 par minute, par IP et par email)
      description: Les comptes admin passent par `/auth/admin/login`. Échec → réponse générique `auth.invalid_credentials`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Session ouverte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/refresh:
    post:
      tags: [auth, admin-auth]
      operationId: refreshTokens
      summary: Renouvelle les tokens (rotation du refresh token)
      description: |
        Mobile : `refreshToken` dans le corps, nouvelle paire dans la réponse.
        Admin web : corps vide, refresh token dans le cookie, `X-CSRF-Token` obligatoire ; nouveaux cookies.
        Un refresh token déjà utilisé révoque toute la session.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Tokens renouvelés
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TokenPair"
                  - $ref: "#/components/schemas/AdminRefreshResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/logout:
    post:
      tags: [auth, admin-auth]
      operationId: logout
      summary: Révoque la session courante (idempotent)
      description: Session identifiée par l'access token, sinon par le refresh token (corps ou cookie + CSRF).
      security: [{}, { bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Déconnecté (cookies effacés le cas échéant) }
  /api/v1/auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: Révoque toutes les sessions de l'utilisateur
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      responses:
        "204": { description: Toutes les sessions révoquées }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Envoie un code de réinitialisation (mêmes limites que la vérification)
      description: Réponse identique que le compte existe ou non.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Nouveau mot de passe avec le code reçu ; révoque toutes les sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Mot de passe changé }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/admin/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: Étape 1 du login admin — mot de passe, ouverture du défi 2FA
      description: Aucune session n'est créée sans 2FA. À la première connexion, la réponse contient le secret TOTP à enregistrer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Défi 2FA ouvert (5 min, 5 essais)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminChallenge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/admin/2fa:
    post:
      tags: [admin-auth]
      operationId: adminSecondFactor
      summary: Étape 2 du login admin — code TOTP (mise en place ou vérification) ou code de secours
      description: Pose les cookies de session. À la mise en place, renvoie les 10 codes de secours (une seule fois).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSecondFactorRequest" }
      responses:
        "200":
          description: Session admin ouverte
          headers:
            Set-Cookie:
              description: "`__Host-gs_at` (access, httpOnly), `__Secure-gs_rt` (refresh, httpOnly, Path=/api/v1/auth), `gs_csrf` (lisible) ; tous Secure et SameSite=Strict"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Profil, statut de la politique de confidentialité et station (gérant)
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Modifie prénom et/ou nom
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Profil mis à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [me]
      operationId: deleteMe
      summary: Supprime le compte (anonymisation, révocation de toutes les sessions)
      description: La station d'un gérant est suspendue. Les comptes admin se suppriment par la CLI.
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountRequest" }
      responses:
        "204": { description: Compte supprimé }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/me/change-password:
    post:
      tags: [me]
      operationId: changePassword
      summary: Change le mot de passe ; révoque les autres sessions
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Mot de passe changé }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/me/accept-privacy-policy:
    post:
      tags: [me]
      operationId: acceptPrivacyPolicy
      summary: Accepte la version courante de la politique de confidentialité
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptPrivacyPolicyRequest" }
      responses:
        "200":
          description: Profil à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/me/sessions:
    get:
      tags: [me]
      operationId: listSessions
      summary: Sessions actives (la plus récemment utilisée d'abord)
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/sessions/{id}:
    delete:
      tags: [me]
      operationId: revokeSession
      summary: Révoque une de ses sessions
      security: [{ bearerAuth: [] }, { cookieAuth: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: Session révoquée }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/manager/station:
    get:
      tags: [manager]
      operationId: getManagerStation
      summary: Station du gérant (statut approved ou rejected)
      description: Gérant pending ou suspended → 403 `station.not_approved` avec l'extension `stationStatus`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Station
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerStation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [manager]
      operationId: updateManagerStation
      summary: Modifie le profil (statut approved ou rejected)
      description: Pour une station approuvée, un changement d'IFU ou de RCCM la renvoie en `pending`. Pour `brand` et `city`, une chaîne vide efface la valeur.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStationRequest" }
      responses:
        "200":
          description: Station modifiée
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerStation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /api/v1/manager/station/resubmission:
    post:
      tags: [manager]
      operationId: resubmitStation
      summary: Renvoie un justificatif après un rejet (statut rejected uniquement)
      description: La station repasse en `pending` ; l'ancien justificatif est supprimé.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document]
              properties:
                document: { type: string, contentMediaType: application/octet-stream, description: "PDF, JPEG ou PNG, 5 Mo max" }
            encoding:
              document: { contentType: "application/pdf, image/jpeg, image/png" }
      responses:
        "200":
          description: Station renvoyée en pending
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerStation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /api/v1/manager/station/location:
    put:
      tags: [manager]
      operationId: setStationLocation
      summary: Épingle la position de la station
      description: |
        Refus hors du Bénin (frontière élargie de 2 km, `station.location_outside_country`). Premier
        épinglage libre ; ensuite, déplacement libre sous 200 m (correction GPS), demande de
        déplacement validée par l'admin au-delà (202, l'ancienne position reste active). Une épingle
        à plus de 500 m de la position de l'appareil est signalée à l'admin (`flagged`), sans blocage.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetLocationRequest" }
      responses:
        "200":
          description: Position appliquée (outcome set ou corrected)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetLocationResponse" }
        "202":
          description: Demande de déplacement en attente de validation (outcome move_requested)
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetLocationResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
  /api/v1/manager/station/opening-hours:
    get:
      tags: [manager]
      operationId: getOpeningHours
      summary: Horaires, fermetures à venir, ouverture en cours
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Horaires
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpeningHours" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [manager]
      operationId: replaceOpeningHours
      summary: Remplace la semaine complète (jour absent = fermé)
      description: Jusqu'à 2 plages par jour, plages qui passent minuit acceptées, 24 h/24 par jour (`is24h`) ou pour toute la semaine (`allWeek24h`). Les chevauchements sont refusés.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
