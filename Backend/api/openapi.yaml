        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token EdDSA de 15 min (clients mobiles).
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-gs_at
      description: Cookie de session de l'admin web (httpOnly, Secure, SameSite=Strict).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Valeur du cookie `gs_csrf`, exigée sur les requêtes non GET authentifiées par cookie.

  parameters:
    InstallId:
      name: X-Install-Id
      in: header
      required: false
      description: UUID généré par l'app au premier lancement ; sert uniquement aux quotas (jamais stocké en clair).
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag de la ressource lue (verrouillage optimiste), par exemple "v3"
      schema: { type: string, examples: ['"v3"'] }
    ClosureId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    ETag:
      description: Version de la station, à renvoyer dans If-Match pour toute écriture
      schema: { type: string, examples: ['"v3"'] }
    RateLimitLimit:
      description: Quota de la fenêtre
      schema: { type: integer }
    RateLimitRemaining:
      description: Requêtes restantes dans la fenêtre
      schema: { type: integer }
    RateLimitReset:
      description: Secondes avant la fin de la fenêtre
      schema: { type: integer }
    RetryAfter:
      description: Secondes avant de réessayer
      schema: { type: integer }

  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReasonRequest" }

  responses:
    PreconditionFailed:
      description: Version périmée (`resource.version_conflict`) — recharger la ressource puis rejouer
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionRequired:
      description: En-tête If-Match absent (`request.precondition_required`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Accepted:
      description: Demande prise en compte (réponse identique que le compte existe ou non)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Accepted" }
    BadRequest:
      description: "Requête mal formée ou code invalide (`request.invalid_json`, `request.invalid_parameter`, `auth.invalid_code`)"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: "Non authentifié (`auth.unauthorized`, `auth.invalid_credentials`, `auth.invalid_refresh_token`, `auth.invalid_mfa_token`, `auth.invalid_second_factor`)"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: "Interdit (`auth.forbidden`, `auth.csrf_failed`, `auth.email_not_verified`, `station.not_approved`)"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Ressource ou route inexistante (`resource.not_found`, `route.not_found`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: "Conflit (`auth.email_taken`, `resource.conflict`, `station.invalid_status_transition`, `station.manager_email_unverified`, `station.closure_exists`)"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Corps ou justificatif trop gros (`request.body_too_large`, `upload.too_large`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: Type refusé (`upload.unsupported_type`, ou Content-Type de requête incorrect)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationFailed:
      description: "Validation échouée (`request.validation_failed`, détail par champ dans `errors`), `upload.invalid_file`, `station.location_outside_country`, `station.no_products_sold`"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Quota dépassé (`rate_limit.exceeded`)
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: Erreur RFC 9457. Des membres d'extension peuvent s'ajouter (`checks`, `stationStatus`…).
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, examples: ["urn:gostation:problem:resource.not_found"] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Code stable, examples: ["auth.invalid_credentials"] }
        requestId: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
      additionalProperties: true
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, examples: ["password"] }
        code: { type: string, description: "required, invalid, too_short, too_long, too_common, too_predictable, outdated, incorrect, unknown_field…" }
        message: { type: string }

    Liveness:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, const: ready }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/JWK" }
    JWK:
      type: object
      required: [kty, crv, x, kid, use, alg]
      properties:
        kty: { type: string, const: OKP }
        crv: { type: string, const: Ed25519 }
        x: { type: string, description: "Clé publique, base64url" }
        kid: { type: string }
        use: { type: string, const: sig }
        alg: { type: string, const: EdDSA }

    Product:
      type: object
      required: [id, code, kind, unit, sizeKg, label]
      properties:
        id: { type: integer }
        code: { type: string, examples: ["lpg_10kg"] }
        kind: { type: string, enum: [lpg, petrol, diesel] }
        unit: { type: string, enum: [cylinder, liter] }
        sizeKg: { type: [number, "null"], description: Taille de la bouteille (gaz uniquement) }
        label: { type: string, examples: ["Gaz 10 kg"] }
    ProductList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }

    Email:
      type: string
      format: email
      maxLength: 254
    NewPassword:
      type: string
      minLength: 8
      maxLength: 128
      description: Refusé s'il est courant ou contient l'email ou « gostation ».
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password, privacyPolicyVersion]
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/NewPassword" }
        privacyPolicyVersion: { type: string, description: Version acceptée ; doit être la version courante, examples: ["1.0"] }
    ManagerRegistration:
      type: object
      required: [firstName, lastName, email, password, privacyPolicyVersion, stationName, ifu, rccm, address, phone, document]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/NewPassword" }
        privacyPolicyVersion: { type: string, examples: ["1.0"] }
        stationName: { type: string, minLength: 2, maxLength: 120 }
        brand: { type: string, maxLength: 60 }
        ifu: { type: string, pattern: "^[0-9]{13}$", description: Identifiant fiscal unique (13 chiffres) }
        rccm: { type: string, examples: ["RB/COT/24 B 12345"] }
        address: { type: string, minLength: 5, maxLength: 255 }
        city: { type: string, maxLength: 100 }
        phone: { type: string, description: "Format international ; espaces, points et tirets acceptés", examples: ["+229 01 90 00 00 00"] }
        document:
          type: string
          contentMediaType: application/octet-stream
          description: Justificatif PDF, JPEG ou PNG, 5 Mo max (type réel vérifié)
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string }
    VerifyEmailRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email: { type: string }
        code: { type: string, pattern: "^[0-9]{6}$" }
    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword]
      additionalProperties: false
      properties:
        email: { type: string }
        code: { type: string, pattern: "^[0-9]{6}$" }
        newPassword: { $ref: "#/components/schemas/NewPassword" }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string }
        password: { type: string }
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken: { type: string, description: Absent pour l'admin web (cookie) }

    TokenPair:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Secondes, examples: [900] }
        refreshToken: { type: string, description: "Opaque, préfixe gsr_ ; à conserver dans expo-secure-store" }
        refreshExpiresIn: { type: integer, description: Secondes }
    SessionResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [user]
          properties:
            user: { $ref: "#/components/schemas/Profile" }
    Accepted:
      type: object
      required: [status]
      properties:
        status: { type: string, const: accepted }

    Profile:
      type: object
      required: [id, email, firstName, lastName, role, emailVerified, twoFactorEnabled, privacyPolicy, station, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string, enum: [user, manager, admin] }
        emailVerified: { type: boolean, description: "Requis pour signaler, ajouter des favoris et activer les notifications" }
        twoFactorEnabled: { type: boolean }
        privacyPolicy: { $ref: "#/components/schemas/PrivacyPolicyStatus" }
        station:
          oneOf:
            - $ref: "#/components/schemas/StationSummary"
            - type: "null"
        createdAt: { type: string, format: date-time }
    PrivacyPolicyStatus:
      type: object
      required: [acceptedVersion, acceptedAt, currentVersion, reacceptRequired]
      properties:
        acceptedVersion: { type: string }
        acceptedAt: { type: string, format: date-time }
        currentVersion: { type: string }
        reacceptRequired: { type: boolean, description: "true : afficher la nouvelle politique et appeler /me/accept-privacy-policy" }
    StationSummary:
      type: object
      required: [id, name, status, statusReason]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [pending, approved, rejected, suspended] }
        statusReason: { type: [string, "null"], description: Motif de rejet ou de suspension }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
    AcceptPrivacyPolicyRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, examples: ["1.0"] }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword: { type: string }
        newPassword: { $ref: "#/components/schemas/NewPassword" }
    DeleteAccountRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string }
    SessionInfo:
      type: object
      required: [id, client, userAgent, createdAt, lastUsedAt, current]
      properties:
        id: { type: string, format: uuid }
        client: { type: string, enum: [mobile, web] }
        userAgent: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionInfo" }

    AdminChallenge:
      type: object
      required: [mfaToken, twoFactor, expiresIn]
      properties:
        mfaToken: { type: string, description: "Opaque, préfixe gsm_ ; 5 min, 5 essais" }
        twoFactor: { type: string, enum: [setup_required, required] }
        expiresIn: { type: integer }
        setup:
          type: object
          description: Présent seulement à la mise en place de la 2FA
          required: [secret, otpauthUri]
          properties:
            secret: { type: string, description: Secret TOTP en base32 (saisie manuelle) }
            otpauthUri: { type: string, description: URI à afficher en QR code }
    AdminSecondFactorRequest:
      type: object
      required: [mfaToken]
      additionalProperties: false
      description: Exactement un de `code` ou `recoveryCode`.
      properties:
        mfaToken: { type: string }
        code: { type: string, pattern: "^[0-9 ]{6,7}$" }
        recoveryCode: { type: string, examples: ["ABCD-EFGH-IJKL-MNOP"] }
    AdminSession:
      type: object
      required: [user, csrfToken, expiresIn]
      properties:
        user: { $ref: "#/components/schemas/Profile" }
        csrfToken: { type: string, description: À envoyer dans X-CSRF-Token (aussi disponible dans le cookie gs_csrf) }
        expiresIn: { type: integer }
        recoveryCodes:
          type: array
          items: { type: string }
          description: Les 10 codes de secours, renvoyés une seule fois, à la mise en place
    AdminRefreshResponse:
      type: object
      required: [csrfToken, expiresIn]
      properties:
        csrfToken: { type: string }
        expiresIn: { type: integer }

    SearchResponse:
      type: object
      required: [product, strategy, radiusM, routingApproximate, results, generatedAt]
      properties:
        product:
          type: object
          required: [id, code, label, unit]
          properties:
            id: { type: integer }
            code: { type: string }
            label: { type: string }
            unit: { type: string, enum: [cylinder, liter] }
        strategy:
          type: string
          enum: [radius, fallback, none]
          description: "radius : stations ouvertes à 50 km ou moins ; fallback : ouvertes plus loin et fermées ; none : aucune station en stock"
        radiusM: { type: [integer, "null"], enum: [500, 1000, 2000, 5000, 10000, 25000, 50000, null], description: Rayon utilisé (null en repli) }
        routingApproximate: { type: boolean, description: "Trajets à vol d'oiseau, durées estimées (hors du Bénin ou OSRM indisponible)" }
        results:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/SearchResult" }
        generatedAt: { type: string, format: date-time }
    SearchResult:
      type: object
      required: [station, distanceM, routeDistanceM, durationS, quantity, stale, stockUpdatedAt, updatedAgoS, isOpen, nextOpening, servedAt]
      properties:
        station:
          type: object
          required: [id, name, brand, location]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            brand: { type: [string, "null"] }
            location: { $ref: "#/components/schemas/LatLng" }
        distanceM: { type: integer, description: "Distance à vol d'oiseau (m)" }
        routeDistanceM: { type: [integer, "null"], description: "Distance routière (null si approximatif ou non joignable)" }
        durationS: { type: [integer, "null"], description: "Trajet en secondes (estimé si routingApproximate ; null si non joignable par la route)" }
        quantity: { type: integer, minimum: 1 }
        stale: { type: boolean, description: "Stock mis à jour il y a plus de 8 h" }
        stockUpdatedAt: { type: string, format: date-time, description: "Dernière saisie ou confirmation du stock" }
        updatedAgoS: { type: integer, description: "« Mis à jour il y a » (secondes)" }
        isOpen: { type: boolean }
        nextOpening: { type: [string, "null"], format: date-time, description: Prochaine ouverture (stations fermées) }
        servedAt: { type: [string, "null"], format: date-time, description: "Heure à laquelle on peut être servi : max(maintenant + trajet, prochaine ouverture)" }
    PublicStation:
      type: object
      required: [id, name, brand, address, city, location, openingHours, stocks]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        brand: { type: [string, "null"] }
        address: { type: string }
        city: { type: [string, "null"] }
        location:
          oneOf:
            - $ref: "#/components/schemas/LatLng"
            - type: "null"
        openingHours:
          type: object
          required: [timezone, isOpenNow, nextOpening, days, closures]
          properties:
            timezone: { type: string, examples: [Africa/Porto-Novo] }
            isOpenNow: { type: boolean }
            nextOpening: { type: [string, "null"], format: date-time }
            days:
              type: array
              items: { $ref: "#/components/schemas/OpeningDay" }
            closures:
              type: array
              description: Fermetures exceptionnelles à venir (dates locales)
              items: { type: string, format: date }
        stocks:
          type: array
          items:
            type: object
            required: [productId, code, label, unit, sizeKg, quantity, updatedAt, freshness]
            properties:
              productId: { type: integer }
              code: { type: string }
              label: { type: string }
              unit: { type: string, enum: [cylinder, liter] }
              sizeKg: { type: [number, "null"] }
              quantity: { type: [integer, "null"], description: "null si le stock est expiré (plus de 24 h)" }
              updatedAt: { type: string, format: date-time }
              freshness: { type: string, enum: [fresh, stale, expired] }
    Route:
      type: object
      required: [stationId, distanceM, durationS, geometry, geometryEncoding, steps]
      properties:
        stationId: { type: string, format: uuid }
        distanceM: { type: integer }
        durationS: { type: integer }
        geometry: { type: string, description: "Tracé complet encodé en polyline (précision 6)" }
        geometryEncoding: { type: string, const: polyline6 }
        steps:
          type: array
          items: { $ref: "#/components/schemas/RouteStep" }
    RouteStep:
      type: object
      description: "Étape sans texte, traduite par le mobile avec osrm-text-instructions (langue fr)."
      required: [maneuver, name, distanceM, durationS]
      properties:
        maneuver:
          type: object
          required: [type, location]
          properties:
            type: { type: string, examples: [depart, turn, "end of road", roundabout, arrive], description: Type de manœuvre OSRM }
            modifier: { type: string, examples: [left, "slight right", uturn] }
            exit: { type: integer, description: Sortie de rond-point }
            location: { $ref: "#/components/schemas/LatLng" }
        name: { type: string, description: Nom de la rue (peut être vide) }
        ref: { type: string, description: "Numéro de route (ex. RNIE 1)" }
        distanceM: { type: number }
        durationS: { type: number }
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    ManagerStation:
      type: object
      required: [id, status, statusReason, version, name, brand, ifu, rccm, address, city, phone, location, locationSetAt, locationFlag, pendingMove, setup, lastStockUpdateAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected, suspended] }
        statusReason: { type: [string, "null"] }
        version: { type: integer, description: Version courante (aussi dans l'en-tête ETag) }
        name: { type: string }
        brand: { type: [string, "null"] }
        ifu: { type: string }
        rccm: { type: string }
        address: { type: string }
        city: { type: [string, "null"] }
        phone: { type: string }
        location:
          oneOf:
            - $ref: "#/components/schemas/LatLng"
            - type: "null"
        locationSetAt: { type: [string, "null"], format: date-time }
        locationFlag:
          oneOf:
            - $ref: "#/components/schemas/LocationFlag"
            - type: "null"
        pendingMove:
          oneOf:
            - $ref: "#/components/schemas/MoveRequest"
            - type: "null"
        setup: { $ref: "#/components/schemas/StationSetup" }
        lastStockUpdateAt: { type: [string, "null"], format: date-time, description: Dernière saisie ou confirmation de stock }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StationSetup:
      type: object
      description: Checklist de configuration et ce qui manque pour apparaître dans la recherche.
      required: [location, openingHours, products, stocks, searchable, missing]
      properties:
        location: { type: boolean, description: Station épinglée }
        openingHours: { type: boolean, description: Au moins une plage horaire }
        products: { type: boolean, description: Au moins un produit vendu }
        stocks: { type: boolean, description: "Au moins un produit vendu en quantité > 0, stock de moins de 24 h" }
        searchable: { type: boolean, description: "Toutes les conditions sont remplies (l'ouverture à l'instant présent n'en fait pas partie)" }
        missing:
          type: array
          items: { type: string, enum: [approval, location, opening_hours, products, stock] }
    UpdateStationRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        brand: { type: string, maxLength: 60, description: Chaîne vide pour effacer }
        address: { type: string, minLength: 5, maxLength: 255 }
        city: { type: string, maxLength: 100, description: Chaîne vide pour effacer }
        phone: { type: string }
        ifu: { type: string, pattern: "^[0-9]{13}$", description: "Modifié sur une station approuvée → pending" }
        rccm: { type: string, description: "Modifié sur une station approuvée → pending" }
    DevicePosition:
      type: object
      required: [lat, lng, accuracyM]
      description: Position GPS de l'appareil (seule la distance à l'épingle est conservée)
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number, minimum: 0, maximum: 10000 }
    SetLocationRequest:
      type: object
      required: [lat, lng, confirmStationLocation]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        confirmStationLocation: { type: boolean, const: true, description: "Acquittement de l'avertissement « épinglez la station, pas votre position »" }
        device: { $ref: "#/components/schemas/DevicePosition" }
    SetLocationResponse:
      type: object
      required: [outcome, flagged, station]
      properties:
        outcome: { type: string, enum: [set, corrected, move_requested] }
        flagged: { type: boolean, description: "Épingle à plus de 500 m de l'appareil, signalée à l'admin" }
        station: { $ref: "#/components/schemas/ManagerStation" }
    LocationFlag:
      type: object
      required: [distanceM, accuracyM, flaggedAt]
      properties:
        distanceM: { type: integer, description: Distance entre l'épingle et l'appareil du gérant }
        accuracyM: { type: [integer, "null"] }
        flaggedAt: { type: string, format: date-time }
    MoveRequest:
      type: object
      required: [id, location, distanceM, deviceDistanceM, deviceAccuracyM, createdAt]
      properties:
        id: { type: string, format: uuid }
        location: { $ref: "#/components/schemas/LatLng" }
        distanceM: { type: integer, description: Distance depuis la position active }
        deviceDistanceM: { type: [integer, "null"] }
        deviceAccuracyM: { type: [integer, "null"] }
        createdAt: { type: string, format: date-time }
    TimeRange:
      type: object
      required: [opens, closes]
      properties:
        opens: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", examples: ["06:00"] }
        closes: { type: string, pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$", description: "Fermeture ; antérieure à l'ouverture = le lendemain ; 00:00 ou 24:00 = minuit", examples: ["22:00"] }
    OpeningDay:
      type: object
      required: [weekday, is24h, ranges]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: "ISO 8601 : 1 = lundi" }
        is24h: { type: boolean }
        ranges:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/TimeRange" }
    ReplaceHoursRequest:
      type: object
      additionalProperties: false
      properties:
        allWeek24h: { type: boolean, description: "24 h/24 tous les jours (days doit alors être vide)" }
        days:
          type: array
          maxItems: 7
          items: { $ref: "#/components/schemas/OpeningDay" }
    Closure:
      type: object
      required: [id, date, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        reason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    AddClosureRequest:
      type: object
      required: [date]
      additionalProperties: false
      properties:
        date: { type: string, format: date, description: "Aujourd'hui ou plus tard, dans l'année qui vient (heure du Bénin)" }
        reason: { type: string, maxLength: 200 }
    OpeningHours:
      type: object
      required: [timezone, isOpenNow, nextOpening, days, closures]
      properties:
        timezone: { type: string, examples: ["Africa/Porto-Novo"] }
        isOpenNow: { type: boolean }
        nextOpening: { type: [string, "null"], format: date-time }
        days:
          type: array
          items: { $ref: "#/components/schemas/OpeningDay" }
        closures:
          type: array
          items: { $ref: "#/components/schemas/Closure" }
    StationProduct:
      type: object
      required: [id, code, kind, unit, sizeKg, label, sold]
      properties:
        id: { type: integer }
        code: { type: string }
        kind: { type: string, enum: [lpg, petrol, diesel] }
        unit: { type: string, enum: [cylinder, liter] }
        sizeKg: { type: [number, "null"] }
        label: { type: string }
        sold: { type: boolean }
    StationProductList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StationProduct" }
    SetProductsRequest:
      type: object
      required: [productIds]
      additionalProperties: false
      properties:
        productIds:
          type: array
          uniqueItems: true
          items: { type: integer }
          description: Liste complète des produits vendus (vide = rien)
    Stock:
      type: object
      required: [productId, code, label, unit, sizeKg, quantity, maxQuantity, updatedAt, lastConfirmedAt, freshAt, freshness]
      properties:
        productId: { type: integer }
        code: { type: string }
        label: { type: string }
        unit: { type: string, enum: [cylinder, liter] }
        sizeKg: { type: [number, "null"] }
        quantity: { type: integer, minimum: 0 }
        maxQuantity: { type: integer, description: Plafond de saisie pour l'unité }
        updatedAt: { type: string, format: date-time, description: Dernier changement de quantité }
        lastConfirmedAt: { type: string, format: date-time, description: Dernière saisie ou confirmation }
        freshAt: { type: string, format: date-time, description: Le plus récent des deux }
        freshness: { type: string, enum: [fresh, stale, expired], description: "stale au-delà de 8 h, expired (exclu de la recherche) au-delà de 24 h" }
    StockList:
      type: object
      required: [lastActivityAt, items]
      properties:
        lastActivityAt: { type: [string, "null"], format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/Stock" }
    UpdateStocksRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
