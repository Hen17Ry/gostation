        "200":
          description: Compte réactivé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/users/{id}/resend-verification:
    post:
      tags: [admin, admin-users]
      operationId: resendUserVerification
      summary: Renvoie le code de vérification de l'email (compte actif non vérifié ; 1/min et 5/h)
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "202": { description: Code envoyé }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/admin/products:
    get:
      tags: [admin, admin-catalog]
      operationId: listAdminProducts
      summary: Catalogue complet, désactivés compris, dans l'ordre d'affichage
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: Page de produits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProductPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [admin, admin-catalog]
      operationId: createProduct
      summary: Crée un produit (type et taille figés ensuite ; code dérivé, ex. lpg_12_5kg)
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductRequest" }
      responses:
        "201":
          description: Produit créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/products/{id}:
    patch:
      tags: [admin, admin-catalog]
      operationId: updateProduct
      summary: Modifie le libellé, l'ordre d'affichage ou l'activation (aucune suppression)
      description: |
        `kind`, `unit`, `sizeKg` et `code` sont refusés (422, code de champ `immutable`). Un produit désactivé
        sort de la recherche, du catalogue public et des choix du gérant ; ses stocks et son historique restent.
        Le cache de recherche du produit est invalidé.
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ProductId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProductRequest" }
      responses:
        "200":
          description: Produit modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/audit:
    get:
      tags: [admin, admin-audit]
      operationId: listAuditLogs
      summary: Journal d'audit, en lecture seule (les entrées les plus récentes d'abord)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, description: "Action exacte, ou préfixe terminé par `*` (`admin.*`)", schema: { type: string, maxLength: 65 } }
        - { name: entityType, in: query, description: "Type de cible : station, user, report, product, export…", schema: { type: string, maxLength: 32 } }
        - { name: entityId, in: query, schema: { type: string, maxLength: 64 } }
        - { name: from, in: query, description: "Date (YYYY-MM-DD, minuit local) ou instant RFC 3339", schema: { type: string } }
        - { name: to, in: query, description: "Date (incluse) ou instant RFC 3339 (exclu)", schema: { type: string } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page du journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/exports:
    get:
      tags: [admin, admin-exports]
      operationId: listExports
      summary: Exports récents, les plus récents d'abord
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page d'exports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [admin, admin-exports]
      operationId: createExport
      summary: Lance un export (généré par le worker, fichier chiffré supprimé 24 h après sa génération)
      description: |
        Jeux : `stations` (avec IFU et RCCM), `stocks` (actuels), `search_stats` (agrégées par cellule et produit,
        seuil k ≥ 5), `reports` (auteur pseudonymisé, jamais l'email), `audit`. CSV UTF-8 avec BOM, séparateur
        « ; », décimaux à virgule, dates en heure locale (Excel en français) ; ou JSON. Période (`from`, `to`,
        dates locales incluses, 30 derniers jours par défaut, 366 jours au plus) pour `search_stats`, `reports`
        et `audit` ; `productId` pour `search_stats`. Jamais la liste des utilisateurs. Audité.
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "202":
          description: Export en attente de génération
          headers:
            Location: { description: URL de l'export, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/admin/exports/{id}:
    get:
      tags: [admin, admin-exports]
      operationId: getExport
      summary: Statut d'un export et, s'il est prêt, lien de téléchargement signé valable 1 h
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ExportId" }]
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/exports/{id}/download:
    get:
      tags: [admin, admin-exports]
      operationId: downloadExport
      summary: Télécharge le fichier (lien signé valable 1 h et session admin ; audité)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ExportId"
        - { name: expires, in: query, required: true, schema: { type: integer, description: Échéance du lien (secondes Unix) } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Fichier (pièce jointe, jamais mis en cache)
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token EdDSA de 15 min (clients mobiles).
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-gs_at
      description: Cookie de session de l'admin web (httpOnly, Secure, SameSite=Strict).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Valeur du cookie `gs_csrf`, exigée sur les requêtes non GET authentifiées par cookie.

  parameters:
    InstallId:
      name: X-Install-Id
      in: header
      required: false
      description: UUID généré par l'app au premier lancement ; sert uniquement aux quotas (jamais stocké en clair).
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag de la ressource lue (verrouillage optimiste), par exemple "v3"
      schema: { type: string, examples: ['"v3"'] }
    ClosureId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FavoriteStationId:
      name: stationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlertId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ExportId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Period:
      name: period
      in: query
      description: "24h (par heure), 7d (défaut), 30d (jours locaux, aujourd'hui compris), custom (avec from et to)"
      schema: { type: string, enum: ["24h", "7d", "30d", custom], default: "7d" }
    PeriodFrom:
      name: from
      in: query
      description: Premier jour local (period=custom uniquement)
      schema: { type: string, format: date }
    PeriodTo:
      name: to
      in: query
      description: "Dernier jour local inclus, au plus aujourd'hui ; 366 jours au plus (period=custom uniquement)"
      schema: { type: string, format: date }
    ProductFilter:
      name: productId
      in: query
      schema: { type: integer, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      description: Valeur nextCursor de la page précédente
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  headers:
    ETag:
      description: Version de la station, à renvoyer dans If-Match pour toute écriture
      schema: { type: string, examples: ['"v3"'] }
    RateLimitLimit:
      description: Quota de la fenêtre
      schema: { type: integer }
    RateLimitRemaining:
      description: Requêtes restantes dans la fenêtre
      schema: { type: integer }
    RateLimitReset:
      description: Secondes avant la fin de la fenêtre
      schema: { type: integer }
    RetryAfter:
      description: Secondes avant de réessayer
      schema: { type: integer }

  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReasonRequest" }

  responses:
    PreconditionFailed:
      description: Version périmée (`resource.version_conflict`) — recharger la ressource puis rejouer
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionRequired:
      description: En-tête If-Match absent (`request.precondition_required`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Accepted:
      description: Demande prise en compte (réponse identique que le compte existe ou non)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Accepted" }
    BadRequest:
      description: "Requête mal formée ou code invalide (`request.invalid_json`, `request.invalid_parameter`, `auth.invalid_code`)"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: "Non authentifié (`auth.unauthorized`, `auth.invalid_credentials`, `auth.invalid_refresh_token`, `auth.invalid_mfa_token`, `auth.invalid_second_factor`)"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: "Interdit (`auth.forbidden`, `auth.csrf_failed`, `auth.email_not_verified`, `auth.account_disabled`, `station.not_approved`, `user.admin_protected`, `export.invalid_signature`)"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Ressource ou route inexistante (`resource.not_found`, `route.not_found`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: "Conflit (`auth.email_taken`, `resource.conflict`, `station.invalid_status_transition`, `station.manager_email_unverified`, `station.closure_exists`, `user.invalid_status`, `user.already_verified`, `product.already_exists`, `export.not_ready`)"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Corps ou justificatif trop gros (`request.body_too_large`, `upload.too_large`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: Type refusé (`upload.unsupported_type`, ou Content-Type de requête incorrect)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationFailed:
      description: "Validation échouée (`request.validation_failed`, détail par champ dans `errors`), `upload.invalid_file`, `station.location_outside_country`, `station.no_products_sold`"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Gone:
      description: "Lien expiré (`export.link_expired`) ou fichier supprimé après 24 h (`export.expired`)"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: Dépendance indisponible (`service.unavailable`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Quota dépassé (`rate_limit.exceeded`)
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: Erreur RFC 9457. Des membres d'extension peuvent s'ajouter (`checks`, `stationStatus`…).
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, examples: ["urn:gostation:problem:resource.not_found"] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Code stable, examples: ["auth.invalid_credentials"] }
        requestId: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
      additionalProperties: true
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, examples: ["password"] }
        code: { type: string, description: "required, invalid, too_short, too_long, too_common, too_predictable, outdated, incorrect, unknown_field…" }
        message: { type: string }

    Liveness:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, const: ready }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/JWK" }
    JWK:
      type: object
      required: [kty, crv, x, kid, use, alg]
      properties:
        kty: { type: string, const: OKP }
        crv: { type: string, const: Ed25519 }
        x: { type: string, description: "Clé publique, base64url" }
        kid: { type: string }
        use: { type: string, const: sig }
        alg: { type: string, const: EdDSA }

    Product:
      type: object
      required: [id, code, kind, unit, sizeKg, label]
      properties:
        id: { type: integer }
        code: { type: string, examples: ["lpg_10kg"] }
        kind: { type: string, enum: [lpg, petrol, diesel] }
        unit: { type: string, enum: [cylinder, liter] }
        sizeKg: { type: [number, "null"], description: Taille de la bouteille (gaz uniquement) }
        label: { type: string, examples: ["Gaz 10 kg"] }
    ProductList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }

    Email:
      type: string
      format: email
      maxLength: 254
    NewPassword:
      type: string
      minLength: 8
      maxLength: 128
      description: Refusé s'il est courant ou contient l'email ou « gostation ».
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password, privacyPolicyVersion]
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/NewPassword" }
        privacyPolicyVersion: { type: string, description: Version acceptée ; doit être la version courante, examples: ["1.0"] }
    ManagerRegistration:
      type: object
      required: [firstName, lastName, email, password, privacyPolicyVersion, stationName, ifu, rccm, address, phone, document]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/NewPassword" }
        privacyPolicyVersion: { type: string, examples: ["1.0"] }
        stationName: { type: string, minLength: 2, maxLength: 120 }
        brand: { type: string, maxLength: 60 }
        ifu: { type: string, pattern: "^[0-9]{13}$", description: Identifiant fiscal unique (13 chiffres) }
        rccm: { type: string, examples: ["RB/COT/24 B 12345"] }
        address: { type: string, minLength: 5, maxLength: 255 }
        city: { type: string, maxLength: 100 }
        phone: { type: string, description: "Format international ; espaces, points et tirets acceptés", examples: ["+229 01 90 00 00 00"] }
        document:
          type: string
          contentMediaType: application/octet-stream
          description: Justificatif PDF, JPEG ou PNG, 5 Mo max (type réel vérifié)
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string }
    VerifyEmailRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email: { type: string }
        code: { type: string, pattern: "^[0-9]{6}$" }
    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword]
      additionalProperties: false
      properties:
        email: { type: string }
        code: { type: string, pattern: "^[0-9]{6}$" }
        newPassword: { $ref: "#/components/schemas/NewPassword" }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string }
        password: { type: string }
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken: { type: string, description: Absent pour l'admin web (cookie) }

    TokenPair:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Secondes, examples: [900] }
        refreshToken: { type: string, description: "Opaque, préfixe gsr_ ; à conserver dans expo-secure-store" }
        refreshExpiresIn: { type: integer, description: Secondes }
    SessionResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [user]
          properties:
            user: { $ref: "#/components/schemas/Profile" }
    Accepted:
      type: object
      required: [status]
      properties:
        status: { type: string, const: accepted }

    Profile:
      type: object
      required: [id, email, firstName, lastName, role, emailVerified, twoFactorEnabled, privacyPolicy, station, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string, enum: [user, manager, admin] }
        emailVerified: { type: boolean, description: "Requis pour signaler, ajouter des favoris et activer les notifications" }
        twoFactorEnabled: { type: boolean }
        privacyPolicy: { $ref: "#/components/schemas/PrivacyPolicyStatus" }
        station:
          oneOf:
            - $ref: "#/components/schemas/StationSummary"
            - type: "null"
        createdAt: { type: string, format: date-time }
    PrivacyPolicyStatus:
      type: object
      required: [acceptedVersion, acceptedAt, currentVersion, reacceptRequired]
      properties:
        acceptedVersion: { type: string }
        acceptedAt: { type: string, format: date-time }
        currentVersion: { type: string }
        reacceptRequired: { type: boolean, description: "true : afficher la nouvelle politique et appeler /me/accept-privacy-policy" }
    StationSummary:
      type: object
      required: [id, name, status, statusReason]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [pending, approved, rejected, suspended] }
        statusReason: { type: [string, "null"], description: Motif de rejet ou de suspension }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
    AcceptPrivacyPolicyRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, examples: ["1.0"] }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword: { type: string }
        newPassword: { $ref: "#/components/schemas/NewPassword" }
    DeleteAccountRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string }
    SessionInfo:
      type: object
      required: [id, client, userAgent, createdAt, lastUsedAt, current]
      properties:
        id: { type: string, format: uuid }
        client: { type: string, enum: [mobile, web] }
        userAgent: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionInfo" }

    AdminChallenge:
      type: object
      required: [mfaToken, twoFactor, expiresIn]
      properties:
        mfaToken: { type: string, description: "Opaque, préfixe gsm_ ; 5 min, 5 essais" }
        twoFactor: { type: string, enum: [setup_required, required] }
        expiresIn: { type: integer }
        setup:
          type: object
          description: Présent seulement à la mise en place de la 2FA
          required: [secret, otpauthUri]
          properties:
            secret: { type: string, description: Secret TOTP en base32 (saisie manuelle) }
            otpauthUri: { type: string, description: URI à afficher en QR code }
    AdminSecondFactorRequest:
      type: object
      required: [mfaToken]
      additionalProperties: false
      description: Exactement un de `code` ou `recoveryCode`.
      properties:
        mfaToken: { type: string }
        code: { type: string, pattern: "^[0-9 ]{6,7}$" }
        recoveryCode: { type: string, examples: ["ABCD-EFGH-IJKL-MNOP"] }
    AdminSession:
      type: object
      required: [user, csrfToken, expiresIn]
      properties:
        user: { $ref: "#/components/schemas/Profile" }
        csrfToken: { type: string, description: À envoyer dans X-CSRF-Token (aussi disponible dans le cookie gs_csrf) }
        expiresIn: { type: integer }
        recoveryCodes:
          type: array
          items: { type: string }
          description: Les 10 codes de secours, renvoyés une seule fois, à la mise en place
    CsrfToken:
      type: object
      required: [csrfToken]
      properties:
        csrfToken: { type: string, description: "HMAC de la session, à envoyer dans X-CSRF-Token" }
    AdminRefreshResponse:
      type: object
      required: [csrfToken, expiresIn]
      properties:
        csrfToken: { type: string }
        expiresIn: { type: integer }

    SearchResponse:
      type: object
      required: [product, strategy, radiusM, routingApproximate, results, generatedAt]
      properties:
        product:
          type: object
          required: [id, code, label, unit]
          properties:
            id: { type: integer }
            code: { type: string }
            label: { type: string }
            unit: { type: string, enum: [cylinder, liter] }
        strategy:
          type: string
          enum: [radius, fallback, none]
          description: "radius : stations ouvertes à 50 km ou moins ; fallback : ouvertes plus loin et fermées ; none : aucune station en stock"
        radiusM: { type: [integer, "null"], enum: [500, 1000, 2000, 5000, 10000, 25000, 50000, null], description: Rayon utilisé (null en repli) }
        routingApproximate: { type: boolean, description: "Trajets à vol d'oiseau, durées estimées (hors du Bénin ou OSRM indisponible)" }
        results:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/SearchResult" }
        generatedAt: { type: string, format: date-time }
    SearchResult:
      type: object
      required: [station, distanceM, routeDistanceM, durationS, quantity, stale, stockUpdatedAt, updatedAgoS, isOpen, nextOpening, servedAt, reported]
      properties:
        station:
          type: object
          required: [id, name, brand, location]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            brand: { type: [string, "null"] }
            location: { $ref: "#/components/schemas/LatLng" }
        distanceM: { type: integer, description: "Distance à vol d'oiseau (m)" }
        routeDistanceM: { type: [integer, "null"], description: "Distance routière (null si approximatif ou non joignable)" }
        durationS: { type: [integer, "null"], description: "Trajet en secondes (estimé si routingApproximate ; null si non joignable par la route)" }
        quantity: { type: integer, minimum: 1 }
        stale: { type: boolean, description: "Stock mis à jour il y a plus de 8 h" }
        stockUpdatedAt: { type: string, format: date-time, description: "Dernière saisie ou confirmation du stock" }
        updatedAgoS: { type: integer, description: "« Mis à jour il y a » (secondes)" }
        isOpen: { type: boolean }
        nextOpening: { type: [string, "null"], format: date-time, description: Prochaine ouverture (stations fermées) }
        servedAt: { type: [string, "null"], format: date-time, description: "Heure à laquelle on peut être servi : max(maintenant + trajet, prochaine ouverture)" }
        reported: { type: boolean, description: "Badge « signalé » : 3 utilisateurs ou plus signalent une rupture du produit ou un problème de station (2 h)" }
    PublicStation:
      type: object
      required: [id, name, brand, address, city, location, openingHours, stocks, reported]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        brand: { type: [string, "null"] }
        address: { type: string }
        city: { type: [string, "null"] }
        reported: { type: boolean, description: "Station signalée (fermée, position incorrecte, autre) par 3 utilisateurs ou plus" }
        location:
          oneOf:
            - $ref: "#/components/schemas/LatLng"
            - type: "null"
        openingHours:
          type: object
          required: [timezone, isOpenNow, nextOpening, days, closures]
          properties:
            timezone: { type: string, examples: [Africa/Porto-Novo] }
            isOpenNow: { type: boolean }
            nextOpening: { type: [string, "null"], format: date-time }
            days:
              type: array
              items: { $ref: "#/components/schemas/OpeningDay" }
            closures:
              type: array
              description: Fermetures exceptionnelles à venir (dates locales)
              items: { type: string, format: date }
        stocks:
          type: array
          items:
            type: object
            required: [productId, code, label, unit, sizeKg, quantity, updatedAt, freshness, reported]
            properties:
              productId: { type: integer }
              code: { type: string }
              label: { type: string }
              unit: { type: string, enum: [cylinder, liter] }
              sizeKg: { type: [number, "null"] }
              quantity: { type: [integer, "null"], description: "null si le stock est expiré (plus de 24 h)" }
              updatedAt: { type: string, format: date-time }
              freshness: { type: string, enum: [fresh, stale, expired] }
              reported: { type: boolean, description: Rupture signalée par 3 utilisateurs ou plus }
    Route:
      type: object
      required: [stationId, distanceM, durationS, geometry, geometryEncoding, steps]
      properties:
        stationId: { type: string, format: uuid }
        distanceM: { type: integer }
        durationS: { type: integer }
        geometry: { type: string, description: "Tracé complet encodé en polyline (précision 6)" }
        geometryEncoding: { type: string, const: polyline6 }
        steps:
          type: array
          items: { $ref: "#/components/schemas/RouteStep" }
    RouteStep:
      type: object
      description: "Étape sans texte, traduite par le mobile avec osrm-text-instructions (langue fr)."
      required: [maneuver, name, distanceM, durationS]
      properties:
        maneuver:
          type: object
          required: [type, location]
          properties:
            type: { type: string, examples: [depart, turn, "end of road", roundabout, arrive], description: Type de manœuvre OSRM }
            modifier: { type: string, examples: [left, "slight right", uturn] }
            exit: { type: integer, description: Sortie de rond-point }
            location: { $ref: "#/components/schemas/LatLng" }
        name: { type: string, description: Nom de la rue (peut être vide) }
        ref: { type: string, description: "Numéro de route (ex. RNIE 1)" }
        distanceM: { type: number }
        durationS: { type: number }
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    ManagerStation:
      type: object
      required: [id, status, statusReason, version, name, brand, ifu, rccm, address, city, phone, location, locationSetAt, locationFlag, pendingMove, setup, lastStockUpdateAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected, suspended] }
        statusReason: { type: [string, "null"] }
        version: { type: integer, description: Version courante (aussi dans l'en-tête ETag) }
        name: { type: string }
        brand: { type: [string, "null"] }
        ifu: { type: string }
        rccm: { type: string }
        address: { type: string }
        city: { type: [string, "null"] }
        phone: { type: string }
        location:
          oneOf:
            - $ref: "#/components/schemas/LatLng"
            - type: "null"
        locationSetAt: { type: [string, "null"], format: date-time }
        locationFlag:
          oneOf:
            - $ref: "#/components/schemas/LocationFlag"
            - type: "null"
        pendingMove:
          oneOf:
            - $ref: "#/components/schemas/MoveRequest"
            - type: "null"
        setup: { $ref: "#/components/schemas/StationSetup" }
        lastStockUpdateAt: { type: [string, "null"], format: date-time, description: Dernière saisie ou confirmation de stock }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StationSetup:
      type: object
      description: Checklist de configuration et ce qui manque pour apparaître dans la recherche.
      required: [location, openingHours, products, stocks, searchable, missing]
      properties:
        location: { type: boolean, description: Station épinglée }
        openingHours: { type: boolean, description: Au moins une plage horaire }
        products: { type: boolean, description: Au moins un produit vendu }
        stocks: { type: boolean, description: "Au moins un produit vendu en quantité > 0, stock de moins de 24 h" }
        searchable: { type: boolean, description: "Toutes les conditions sont remplies (l'ouverture à l'instant présent n'en fait pas partie)" }
        missing:
          type: array
          items: { type: string, enum: [approval, location, opening_hours, products, stock] }
    UpdateStationRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        brand: { type: string, maxLength: 60, description: Chaîne vide pour effacer }
        address: { type: string, minLength: 5, maxLength: 255 }
        city: { type: string, maxLength: 100, description: Chaîne vide pour effacer }
        phone: { type: string }
        ifu: { type: string, pattern: "^[0-9]{13}$", description: "Modifié sur une station approuvée → pending" }
        rccm: { type: string, description: "Modifié sur une station approuvée → pending" }
    DevicePosition:
      type: object
      required: [lat, lng, accuracyM]
      description: Position GPS de l'appareil (seule la distance à l'épingle est conservée)
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number, minimum: 0, maximum: 10000 }
    SetLocationRequest:
      type: object
      required: [lat, lng, confirmStationLocation]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        confirmStationLocation: { type: boolean, const: true, description: "Acquittement de l'avertissement « épinglez la station, pas votre position »" }
        device: { $ref: "#/components/schemas/DevicePosition" }
    SetLocationResponse:
      type: object
      required: [outcome, flagged, station]
      properties:
        outcome: { type: string, enum: [set, corrected, move_requested] }
        flagged: { type: boolean, description: "Épingle à plus de 500 m de l'appareil, signalée à l'admin" }
        station: { $ref: "#/components/schemas/ManagerStation" }
    LocationFlag:
      type: object
      required: [distanceM, accuracyM, flaggedAt]
      properties:
        distanceM: { type: integer, description: Distance entre l'épingle et l'appareil du gérant }
        accuracyM: { type: [integer, "null"] }
        flaggedAt: { type: string, format: date-time }
    MoveRequest:
      type: object
      required: [id, location, distanceM, deviceDistanceM, deviceAccuracyM, createdAt]
      properties:
        id: { type: string, format: uuid }
        location: { $ref: "#/components/schemas/LatLng" }
        distanceM: { type: integer, description: Distance depuis la position active }
        deviceDistanceM: { type: [integer, "null"] }
        deviceAccuracyM: { type: [integer, "null"] }
        createdAt: { type: string, format: date-time }
    TimeRange:
      type: object
      required: [opens, closes]
      properties:
        opens: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", examples: ["06:00"] }
        closes: { type: string, pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$", description: "Fermeture ; antérieure à l'ouverture = le lendemain ; 00:00 ou 24:00 = minuit", examples: ["22:00"] }
    OpeningDay:
      type: object
      required: [weekday, is24h, ranges]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: "ISO 8601 : 1 = lundi" }
        is24h: { type: boolean }
        ranges:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/TimeRange" }
    ReplaceHoursRequest:
      type: object
      additionalProperties: false
      properties:
        allWeek24h: { type: boolean, description: "24 h/24 tous les jours (days doit alors être vide)" }
        days:
          type: array
          maxItems: 7
          items: { $ref: "#/components/schemas/OpeningDay" }
    Closure:
      type: object
      required: [id, date, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        reason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    AddClosureRequest:
      type: object
      required: [date]
      additionalProperties: false
      properties:
        date: { type: string, format: date, description: "Aujourd'hui ou plus tard, dans l'année qui vient (heure du Bénin)" }
        reason: { type: string, maxLength: 200 }
    OpeningHours:
      type: object
      required: [timezone, isOpenNow, nextOpening, days, closures]
      properties:
        timezone: { type: string, examples: ["Africa/Porto-Novo"] }
        isOpenNow: { type: boolean }
        nextOpening: { type: [string, "null"], format: date-time }
        days:
          type: array
          items: { $ref: "#/components/schemas/OpeningDay" }
        closures:
          type: array
          items: { $ref: "#/components/schemas/Closure" }
    StationProduct:
      type: object
      required: [id, code, kind, unit, sizeKg, label, sold]
      properties:
        id: { type: integer }
        code: { type: string }
        kind: { type: string, enum: [lpg, petrol, diesel] }
        unit: { type: string, enum: [cylinder, liter] }
        sizeKg: { type: [number, "null"] }
        label: { type: string }
        sold: { type: boolean }
    StationProductList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StationProduct" }
    SetProductsRequest:
      type: object
      required: [productIds]
      additionalProperties: false
      properties:
        productIds:
          type: array
          uniqueItems: true
          items: { type: integer }
          description: Liste complète des produits vendus (vide = rien)
    Stock:
      type: object
      required: [productId, code, label, unit, sizeKg, quantity, maxQuantity, updatedAt, lastConfirmedAt, freshAt, freshness]
      properties:
        productId: { type: integer }
        code: { type: string }
        label: { type: string }
        unit: { type: string, enum: [cylinder, liter] }
        sizeKg: { type: [number, "null"] }
        quantity: { type: integer, minimum: 0 }
        maxQuantity: { type: integer, description: Plafond de saisie pour l'unité }
        updatedAt: { type: string, format: date-time, description: Dernier changement de quantité }
        lastConfirmedAt: { type: string, format: date-time, description: Dernière saisie ou confirmation }
        freshAt: { type: string, format: date-time, description: Le plus récent des deux }
        freshness: { type: string, enum: [fresh, stale, expired], description: "stale au-delà de 8 h, expired (exclu de la recherche) au-delà de 24 h" }
    StockList:
      type: object
      required: [lastActivityAt, items]
      properties:
        lastActivityAt: { type: [string, "null"], format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/Stock" }
    UpdateStocksRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [productId, quantity]
            additionalProperties: false
            properties:
              productId: { type: integer }
              quantity: { type: integer, minimum: 0 }
    ReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    AdminStationSummary:
      type: object
      required: [id, name, brand, ifu, city, status, version, location, managerEmailVerified, locationFlagged, hasPendingMove,
        hasOpeningHours, lastStockUpdateAt, freshness, reported, managerInactive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        brand: { type: [string, "null"] }
        ifu: { type: string }
        city: { type: [string, "null"] }
        status: { type: string, enum: [pending, approved, rejected, suspended] }
        version: { type: integer }
        location:
          oneOf:
            - $ref: "#/components/schemas/LatLng"
            - type: "null"
        managerEmailVerified: { type: boolean }
        locationFlagged: { type: boolean }
        hasPendingMove: { type: boolean }
        hasOpeningHours: { type: boolean }
        lastStockUpdateAt: { type: [string, "null"], format: date-time }
        freshness: { $ref: "#/components/schemas/StationFreshness" }
        reported: { type: boolean }
        managerInactive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminStationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminStationSummary" }
        nextCursor: { type: [string, "null"] }
    AdminManager:
      type: object
      required: [id, firstName, lastName, email, emailVerified]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
    AdminStation:
      type: object
      required: [id, status, statusReason, reviewedAt, version, name, brand, ifu, rccm, address, city, phone, location, locationSetAt, locationFlag, pendingMove, documentMime, manager, lastStockUpdateAt, statusChangedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected, suspended] }
        statusReason: { type: [string, "null"] }
        reviewedAt: { type: [string, "null"], format: date-time }
        version: { type: integer }
        name: { type: string }
        brand: { type: [string, "null"] }
        ifu: { type: string }
        rccm: { type: string }
        address: { type: string }
        city: { type: [string, "null"] }
        phone: { type: string }
        location:
          oneOf:
            - $ref: "#/components/schemas/LatLng"
            - type: "null"
        locationSetAt: { type: [string, "null"], format: date-time }
        locationFlag:
          oneOf:
            - $ref: "#/components/schemas/LocationFlag"
            - type: "null"
        pendingMove:
          oneOf:
            - $ref: "#/components/schemas/MoveRequest"
            - type: "null"
        documentMime: { type: [string, "null"] }
        manager:
          oneOf:
            - $ref: "#/components/schemas/AdminManager"
            - type: "null"
        lastStockUpdateAt: { type: [string, "null"], format: date-time }
        statusChangedAt: { type: string, format: date-time, description: Dernier changement de statut }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DeviceRequest:
      type: object
      required: [token, platform, installId]
      additionalProperties: false
      properties:
        token: { type: string, maxLength: 255, examples: ["ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"] }
        platform: { type: string, enum: [ios, android] }
        installId: { type: string, format: uuid, description: UUID de l'installation (le même que X-Install-Id) }
        language: { type: string, enum: [fr, en], default: fr, description: Langue des push }
        appVersion: { type: [string, "null"], maxLength: 32 }
    Device:
      type: object
      required: [id, platform, language, appVersion, createdAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        language: { type: string, enum: [fr, en] }
        appVersion: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    NotificationType:
      type: string
      enum: [stock_reminder, station_reported, back_in_stock]
    Notification:
      type: object
      required: [id, type, data, createdAt, readAt]
      description: |
        `data` (et les données du push, qui y ajoutent `type` et `notificationId`) selon le type :
        - `stock_reminder` : `stationId`, `stationName`, `hoursSinceUpdate` (absent si jamais mis à jour),
          `etag` ; le push porte la catégorie Expo `stock_reminder` et `actions` : `update` (ouvre
          l'app) et `confirm` (POST `/api/v1/manager/station/stocks/confirm` avec `If-Match: etag`, sans
          ouvrir l'app ; un 412 signifie que les stocks ont déjà bougé) ;
        - `station_reported` : `stationId`, `stationName`, `reason`, `productId`/`productLabel` (rupture),
          `reporters`, `level` (`flagged` à 3, `excluded` à 5) — jamais l'identité des auteurs ;
        - `back_in_stock` : `stationId`, `stationName`, `productId`, `productLabel`.
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/NotificationType" }
        data: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    NotificationPage:
      type: object
      required: [items, nextCursor, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        nextCursor: { type: [string, "null"] }
        unreadCount: { type: integer }
    MarkReadRequest:
      type: object
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        all: { type: boolean, description: "Tout marquer comme lu (ids alors vide)" }
    UnreadCount:
      type: object
      required: [unreadCount]
      properties:
        unreadCount: { type: integer }
    NotificationSetting:
      type: object
      required: [type, enabled]
      properties:
        type: { $ref: "#/components/schemas/NotificationType" }
        enabled: { type: boolean }
    NotificationSettingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationSetting" }
    UpdateNotificationSettingsRequest:
      type: object
      required: [settings]
      additionalProperties: false
      properties:
        settings:
          type: array
          items: { $ref: "#/components/schemas/NotificationSetting" }
    Favorite:
      type: object
      required: [station, available, alertProductIds, createdAt]
      properties:
        station:
          type: object
          required: [id, name, brand, address, city, location]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            brand: { type: [string, "null"] }
            address: { type: string }
            city: { type: [string, "null"] }
            location:
              oneOf:
                - $ref: "#/components/schemas/LatLng"
                - type: "null"
        available: { type: boolean, description: "Station approuvée (fiche et recherche) ; false si suspendue entre-temps" }
        alertProductIds:
          type: array
          description: Produits suivis pour l'alerte « de retour en stock »
          items: { type: integer }
        createdAt: { type: string, format: date-time }
    FavoriteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Favorite" }
    AddFavoriteRequest:
      type: object
      additionalProperties: false
      properties:
        alertProductIds:
          type: array
          description: Remplace les produits suivis (absent = inchangés, [] = aucun)
          items: { type: integer }
    ReportReason:
      type: string
      enum: [out_of_stock, station_closed, wrong_location, other]
    ReportRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/ReportReason" }
        productId: { type: integer, description: "Obligatoire pour out_of_stock, interdit sinon" }
        comment: { type: string, maxLength: 300, description: Obligatoire pour other }
        position:
          allOf: [{ $ref: "#/components/schemas/LatLng" }]
          description: "Obligatoire pour out_of_stock et station_closed : contrôle des 2 km, jamais stockée ni journalisée"
    Report:
      type: object
      required: [id, reason, productId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReportReason" }
        productId: { type: [integer, "null"] }
        status: { type: string, enum: [open, resolved, dismissed] }
        createdAt: { type: string, format: date-time }
    ProductRef:
      type: object
      required: [id, label]
      properties:
        id: { type: integer }
        label: { type: string }
    StationRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ReportFlag:
      type: object
      required: [reason, product, reporters, level, flaggedAt, excludedAt]
      properties:
        reason: { $ref: "#/components/schemas/ReportReason" }
        product:
          oneOf:
            - $ref: "#/components/schemas/ProductRef"
            - type: "null"
        reporters: { type: integer, description: Auteurs distincts au dernier franchissement }
        level: { type: string, enum: [flagged, excluded] }
        flaggedAt: { type: string, format: date-time }
        excludedAt: { type: [string, "null"], format: date-time }
    ManagerReport:
      type: object
      required: [id, reason, product, status, createdAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReportReason" }
        product:
          oneOf:
            - $ref: "#/components/schemas/ProductRef"
            - type: "null"
        status: { type: string, enum: [open, resolved, dismissed] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }
    ManagerReportPage:
      type: object
      required: [flags, items, nextCursor]
      properties:
        flags:
          type: array
          items: { $ref: "#/components/schemas/ReportFlag" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ManagerReport" }
        nextCursor: { type: [string, "null"] }
    Reporter:
      type: object
      required: [id, firstName, lastName, email, abusiveReports, reportingBanned]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        abusiveReports: { type: integer, description: Signalements de l'auteur classés abusifs }
        reportingBanned: { type: boolean }
    AdminReport:
      type: object
      required: [id, station, reason, product, comment, status, abusive, resolutionNote, resolvedAt, createdAt, reporter]
      properties:
        id: { type: string, format: uuid }
        station: { $ref: "#/components/schemas/StationRef" }
        reason: { $ref: "#/components/schemas/ReportReason" }
        product:
          oneOf:
            - $ref: "#/components/schemas/ProductRef"
            - type: "null"
        comment: { type: [string, "null"] }
        status: { type: string, enum: [open, resolved, dismissed] }
        abusive: { type: boolean }
        resolutionNote: { type: [string, "null"] }
        resolvedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        reporter:
          oneOf:
            - $ref: "#/components/schemas/Reporter"
            - type: "null"
    AdminReportPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminReport" }
        nextCursor: { type: [string, "null"] }
    NoteRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 500 }
    DismissReportRequest:
      type: object
      additionalProperties: false
      properties:
        abusive: { type: boolean, default: false }
        note: { type: string, maxLength: 500 }
    ReportingBanRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdminAlert:
      type: object
      required: [id, kind, station, reason, product, details, createdAt, resolvedAt, resolvedBy, resolution]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [manager_inactive, reports_threshold] }
        station: { $ref: "#/components/schemas/StationRef" }
        reason:
          oneOf:
            - $ref: "#/components/schemas/ReportReason"
            - type: "null"
        product:
          oneOf:
            - $ref: "#/components/schemas/ProductRef"
            - type: "null"
        details: { type: object, additionalProperties: true, description: "ignoredReminders (gérant inactif) ou reporters (seuil)" }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }
        resolvedBy: { type: [string, "null"], format: uuid, description: "null + resolvedAt : résolue par l'activité du gérant" }
        resolution: { type: [string, "null"] }
    AdminAlertPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminAlert" }
        nextCursor: { type: [string, "null"] }
    MuteResponse:
      type: object
      required: [mutedUntil]
      properties:
        mutedUntil: { type: string, format: date-time }
    Period:
      type: object
      required: [key, from, to, previousFrom, previousTo, granularity, timezone]
      properties:
        key: { type: string, enum: ["24h", "7d", "30d", custom] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: Exclu }
        previousFrom: { type: string, format: date-time }
        previousTo: { type: string, format: date-time }
        granularity: { type: string, enum: [hour, day], description: Tranches des séries }
        timezone: { type: string, examples: ["Africa/Porto-Novo"] }
    KPI:
      type: object
      required: [value, previous, change]
      properties:
        value: { type: number }
        previous: { type: number, description: Même indicateur sur la période précédente }
        change: { type: [number, "null"], description: "Évolution relative (0.25 = +25 %) ; null si previous vaut 0" }
    ProductCodeRef:
      type: object
      required: [id, code, label]
      properties:
        id: { type: integer }
        code: { type: string }
        label: { type: string }
    SearchSeriesPoint:
      type: object
      required: [at, searches, emptySearches, byProduct]
      properties:
        at: { type: string, format: date-time, description: "Début de la tranche (heure, ou minuit local)" }
        searches: { type: integer }
        emptySearches: { type: integer, description: Recherches sans station ouverte à 5 km }
        byProduct: { type: object, additionalProperties: { type: integer }, description: Recherches par code produit }
    FreshnessPoint:
      type: object
      required: [at, fresh, stale, expired]
      properties:
        at: { type: string, format: date-time }
        fresh: { type: [integer, "null"], description: Moyenne des relevés horaires ; null si aucun relevé }
        stale: { type: [integer, "null"] }
        expired: { type: [integer, "null"] }
    Zone:
      type: object
      required: [cell, center, searches, emptySearches, emptyRate]
      properties:
        cell: { type: string, description: Index H3 res 7 hexadécimal }
        center: { $ref: "#/components/schemas/LatLng" }
        searches: { type: integer }
        emptySearches: { type: integer }
        emptyRate: { type: number }
    Dashboard:
      type: object
      required: [period, stations, stockFreshness, inactiveManagers, searches, shortages, reports, alerts, registrations, series]
      properties:
        period: { $ref: "#/components/schemas/Period" }
        stations:
          type: object
          required: [byStatus, pendingApplications]
          properties:
            byStatus:
              type: object
              description: "Stations par statut (un dossier pending ne compte qu'une fois l'email du gérant vérifié)"
              additionalProperties: { type: integer }
            pendingApplications:
              type: object
              required: [count, oldestSince, oldestAgeS]
              properties:
                count: { type: integer }
                oldestSince: { type: [string, "null"], format: date-time, description: Passage en attente du plus vieux dossier }
                oldestAgeS: { type: [integer, "null"] }
        stockFreshness:
          type: object
          description: "Stocks des stations approuvées : frais (< 8 h), stale (8 à 24 h), exclus (> 24 h)"
          required: [fresh, stale, expired, total, freshShare, staleShare, expiredShare]
          properties:
            fresh: { type: integer }
            stale: { type: integer }
            expired: { type: integer }
            total: { type: integer }
            freshShare: { type: number }
            staleShare: { type: number }
            expiredShare: { type: number }
        inactiveManagers: { type: integer, description: "Alertes « gérant inactif » ouvertes" }
        searches:
          type: object
          required: [total, byProduct, emptyRate]
          properties:
            total: { $ref: "#/components/schemas/KPI" }
            byProduct:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/KPI"
                  - type: object
                    required: [product]
                    properties:
                      product: { $ref: "#/components/schemas/ProductCodeRef" }
            emptyRate: { $ref: "#/components/schemas/KPI" }
        shortages:
          type: object
          required: [zones, top, k, threshold]
          properties:
            zones: { type: integer }
            top: { type: array, items: { $ref: "#/components/schemas/Zone" }, description: "10 au plus, par recherches sans résultat" }
            k: { type: integer, examples: [5] }
            threshold: { type: number, examples: [0.5] }
        reports:
          type: object
          required: [open, created]
          properties:
            open: { type: integer }
            created: { $ref: "#/components/schemas/KPI" }
        alerts:
          type: object
          required: [open, byKind]
          properties:
            open: { type: integer }
            byKind: { type: object, additionalProperties: { type: integer } }
        registrations:
          type: object
          required: [users, managers]
          properties:
            users: { $ref: "#/components/schemas/KPI" }
            managers: { $ref: "#/components/schemas/KPI" }
        series:
          type: object
          required: [searches, freshness]
          properties:
            searches: { type: array, items: { $ref: "#/components/schemas/SearchSeriesPoint" } }
            freshness: { type: array, items: { $ref: "#/components/schemas/FreshnessPoint" } }
    SearchStats:
      type: object
      required: [period, productId, totals, series, byHourOfDay]
      properties:
        period: { $ref: "#/components/schemas/Period" }
        productId: { type: [integer, "null"] }
        totals:
          type: object
          required: [searches, emptyRate]
          properties:
            searches: { $ref: "#/components/schemas/KPI" }
            emptyRate: { $ref: "#/components/schemas/KPI" }
        series: { type: array, items: { $ref: "#/components/schemas/SearchSeriesPoint" } }
        byHourOfDay:
          type: array
          description: 24 éléments, heure locale
          items:
            type: object
            required: [hour, searches, emptySearches]
            properties:
              hour: { type: integer, minimum: 0, maximum: 23 }
              searches: { type: integer }
              emptySearches: { type: integer }
    ShortageMap:
      type: object
      required: [type, period, productId, k, threshold, maskedCells, features]
      properties:
        type: { type: string, const: FeatureCollection }
        period: { $ref: "#/components/schemas/Period" }
        productId: { type: [integer, "null"] }
        k: { type: integer, description: Recherches minimum d'une cellule affichée }
        threshold: { type: number, description: Part de recherches sans station ouverte à 5 km d'une zone en pénurie }
        maskedCells: { type: integer, description: Cellules masquées (moins de k recherches) }
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type: { type: string, const: Feature }
              id: { type: string, description: Index H3 res 7 hexadécimal }
              geometry:
                type: object
                required: [type, coordinates]
                properties:
                  type: { type: string, const: Polygon }
                  coordinates:
                    type: array
                    description: Un anneau fermé de positions [lng, lat]
                    items: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 } }
              properties:
                type: object
                required: [cell, searches, emptySearches, emptyRate, shortage]
                properties:
                  cell: { type: string }
                  searches: { type: integer }
                  emptySearches: { type: integer }
                  emptyRate: { type: number }
                  shortage: { type: boolean }
    StationMap:
      type: object
      required: [type, features]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type: { type: string, const: Feature }
              id: { type: string, format: uuid }
              geometry:
                type: object
                required: [type, coordinates]
                properties:
                  type: { type: string, const: Point }
                  coordinates: { type: array, items: { type: number }, minItems: 2, maxItems: 2, description: "[lng, lat]" }
              properties:
                type: object
                required: [name, status, freshness, reported]
                properties:
                  name: { type: string }
                  status: { type: string, enum: [pending, approved, rejected, suspended] }
                  freshness: { $ref: "#/components/schemas/StationFreshness" }
                  reported: { type: boolean }
    StationFreshness:
      type: string
      enum: [fresh, stale, expired, none]
      description: "Dernière saisie ou confirmation des stocks : < 8 h, 8 à 24 h, > 24 h, jamais"
    AdminUpdateStationRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        brand: { type: string, maxLength: 60, description: Chaîne vide = efface }
        address: { type: string, minLength: 5, maxLength: 255 }
        city: { type: string, maxLength: 100, description: Chaîne vide = efface }
        phone: { type: string, description: "E.164, ex. +2290190000000" }
        ifu: { type: string, pattern: "^[0-9]{13}$" }
        rccm: { type: string }
        reason: { type: string, minLength: 3, maxLength: 500, description: "Motif de la correction (email au gérant, audit)" }
    AdminUserSummary:
      type: object
      required: [id, role, status, email, firstName, lastName, emailVerified, reportingBanned, lastLoginAt, disabledAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, manager, admin] }
        status: { type: string, enum: [active, disabled, pending_deletion] }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        emailVerified: { type: boolean }
        reportingBanned: { type: boolean }
        lastLoginAt: { type: [string, "null"], format: date-time }
        disabledAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminUserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminUserSummary" } }
        nextCursor: { type: [string, "null"] }
    AdminUser:
      type: object
      required: [id, role, status, email, firstName, lastName, emailVerified, emailVerifiedAt, privacyPolicyVersion, privacyAcceptedAt,
        twoFactorEnabled, lastLoginAt, passwordChangedAt, disabledAt, disabledReason, reportingBannedAt, reportingBanReason,
        deletionRequestedAt, activeSessions, devices, reports, favorites, station, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, manager, admin] }
        status: { type: string, enum: [active, disabled, pending_deletion] }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        emailVerified: { type: boolean }
        emailVerifiedAt: { type: [string, "null"], format: date-time }
        privacyPolicyVersion: { type: string }
        privacyAcceptedAt: { type: string, format: date-time }
        twoFactorEnabled: { type: boolean }
        lastLoginAt: { type: [string, "null"], format: date-time }
        passwordChangedAt: { type: [string, "null"], format: date-time }
        disabledAt: { type: [string, "null"], format: date-time }
        disabledReason: { type: [string, "null"] }
        reportingBannedAt: { type: [string, "null"], format: date-time }
        reportingBanReason: { type: [string, "null"] }
        deletionRequestedAt: { type: [string, "null"], format: date-time }
        activeSessions: { type: integer }
        devices: { type: integer, description: Appareils push enregistrés }
        reports:
          type: object
          required: [total, abusive]
          properties:
            total: { type: integer }
            abusive: { type: integer }
        favorites: { type: integer }
        station:
          oneOf:
            - type: object
              required: [id, name, status]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                status: { type: string, enum: [pending, approved, rejected, suspended] }
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminProduct:
      type: object
      required: [id, code, kind, unit, sizeKg, label, active, sortOrder, stations, createdAt, updatedAt]
      properties:
        id: { type: integer }
        code: { type: string, examples: ["lpg_12_5kg"] }
        kind: { type: string, enum: [lpg, petrol, diesel] }
        unit: { type: string, enum: [cylinder, liter] }
        sizeKg: { type: [number, "null"] }
        label: { type: string }
        active: { type: boolean }
        sortOrder: { type: integer }
        stations: { type: integer, description: Stations qui vendent le produit }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminProductPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminProduct" } }
        nextCursor: { type: [string, "null"] }
    CreateProductRequest:
      type: object
      required: [kind, label]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [lpg, petrol, diesel] }
        sizeKg: { type: number, minimum: 0.5, maximum: 100, multipleOf: 0.01, description: "Obligatoire pour le gaz, interdite pour les carburants" }
        label: { type: string, minLength: 2, maxLength: 60 }
        sortOrder: { type: integer, minimum: 0, maximum: 9999, description: "Défaut : après le dernier produit" }
        active: { type: boolean, default: true }
    UpdateProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label: { type: string, minLength: 2, maxLength: 60 }
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }
        active: { type: boolean }
    AuditEntry:
      type: object
      required: [id, actor, action, entityType, entityId, metadata, requestId, createdAt]
      properties:
        id: { type: string }
        actor:
          oneOf:
            - type: object
              required: [id, role, firstName, lastName, email]
              properties:
                id: { type: string, format: uuid }
                role: { type: [string, "null"] }
                firstName: { type: [string, "null"] }
                lastName: { type: [string, "null"] }
                email: { type: [string, "null"] }
            - type: "null"
        action: { type: string, examples: ["admin.station_approved"] }
        entityType: { type: string }
        entityId: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: true }
        requestId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        nextCursor: { type: [string, "null"] }
    ExportRequest:
      type: object
      required: [dataset]
      additionalProperties: false
      properties:
        dataset: { type: string, enum: [stations, stocks, search_stats, reports, audit] }
        format: { type: string, enum: [csv, json], default: csv }
        from: { type: string, format: date, description: "search_stats, reports, audit (défaut : il y a 29 jours)" }
        to: { type: string, format: date, description: "Inclus, au plus aujourd'hui (défaut : aujourd'hui)" }
        productId: { type: integer, description: search_stats uniquement }
    Export:
      type: object
      required: [id, dataset, format, params, status, error, rowCount, sizeBytes, requestedBy, createdAt, completedAt, expiresAt, download]
      properties:
        id: { type: string, format: uuid }
        dataset: { type: string, enum: [stations, stocks, search_stats, reports, audit] }
        format: { type: string, enum: [csv, json] }
        params:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            productId: { type: integer }
        status: { type: string, enum: [pending, ready, failed, expired] }
        error: { type: [string, "null"], enum: [too_many_rows, generation_failed, timeout, queue_unavailable, null] }
        rowCount: { type: [integer, "null"] }
        sizeBytes: { type: [integer, "null"] }
        requestedBy:
          oneOf:
            - type: object
              required: [id, firstName, lastName]
              properties:
                id: { type: string, format: uuid }
                firstName: { type: string }
                lastName: { type: string }
            - type: "null"
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time, description: Suppression du fichier (24 h après la génération) }
        download:
          oneOf:
            - type: object
              required: [url, expiresAt]
              properties:
                url: { type: string, description: Chemin signé (à appeler avec la session admin) }
                expiresAt: { type: string, format: date-time, description: Fin de validité du lien (1 h) }
            - type: "null"
    ExportPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Export" } }
        nextCursor: { type: [string, "null"] }
