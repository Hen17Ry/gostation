# GoStation — infrastructure locale (dev).
# Toutes les valeurs viennent de .env (voir .env.example). Démarrage : `make up`.
name: gostation

services:
  postgres:
    image: ${POSTGIS_IMAGE:-postgis/postgis:18-3.6}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5440}:5432"
    volumes:
      # PG ≥ 18 : PGDATA=/var/lib/postgresql/18/docker → on monte le parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Prêt = accepte les connexions TCP ET l'extension PostGIS répond. Passer par TCP évite
      # un faux « healthy » pendant l'initdb (le serveur temporaire n'écoute que le socket Unix).
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" && psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc 'SELECT PostGIS_Version()' > /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [net]

  redis:
    image: ${REDIS_IMAGE:-redis:8.10.2-alpine}
    restart: unless-stopped
    # noeviction : Redis porte aussi les refresh tokens et les files asynq, qui ne doivent
    # jamais être évincés. Les clés de cache ont toutes un TTL explicite.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    environment:
      # Lu automatiquement par redis-cli (healthcheck, `make redis-cli`).
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6390}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [net]

  osrm:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v26.10.0-debian}
    restart: unless-stopped
    # Les données doivent avoir été préparées avant : `make osrm-prepare`.
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --max-table-size
      - "${OSRM_MAX_TABLE_SIZE:-100}"
      - /data/${OSRM_DATASET:-benin}.osrm
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${OSRM_PORT:-5000}:5000"
    volumes:
      - osrmdata:/data:ro
    healthcheck:
      # Pas de curl/wget dans l'image : requête HTTP via /dev/tcp (bash), point à Cotonou.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/5000 &&
          printf 'GET /nearest/v1/driving/2.4253,6.3703 HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"code":"Ok"' <&3
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [net]

  # API Go (profil « api », démarrée par `make api-up` après les migrations, avec le worker).
  api:
    build:
      context: ./Backend
      args:
        VERSION: ${API_VERSION:-dev}
    image: gostation-api:${API_VERSION:-dev}
    profiles: [api]
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Adresses internes au réseau compose : remplacent les localhost:… de .env.
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OSRM_URL: http://osrm:5000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      DOCUMENTS_STORAGE_DIR: /var/lib/gostation/documents
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8080}:8080"
    volumes:
      # Justificatifs IFU et exports admin chiffrés (stockage local en attendant un stockage objet).
      - documents:/var/lib/gostation/documents
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      osrm: { condition: service_healthy }
      mailpit: { condition: service_healthy, required: false }
    healthcheck:
      # Image distroless (ni shell ni curl) : le binaire interroge lui-même /readyz.
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [net]

  # Worker asynq (profil « api », démarré par `make worker-up` ou `make api-up`) : emails, push,
  # alertes, rappels, stats, exports admin, purges. Même image que l'API. UNE SEULE instance : le scheduler des
  # tâches périodiques tourne dans ce processus (ARCHITECTURE §7).
  worker:
    build:
      context: ./Backend
      args:
        VERSION: ${API_VERSION:-dev}
    image: gostation-api:${API_VERSION:-dev}
    profiles: [api]
    restart: unless-stopped
    entrypoint: ["/app/worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OSRM_URL: http://osrm:5000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Même stockage que l'API : le worker y écrit les exports admin chiffrés, que l'API sert.
      DOCUMENTS_STORAGE_DIR: /var/lib/gostation/documents
      WORKER_HEALTH_ADDR: ":8081"
    volumes:
      - documents:/var/lib/gostation/documents
    deploy:
      replicas: 1
    # Laisse au worker le temps de finir ses tâches (WORKER_SHUTDOWN_TIMEOUT, 25 s par défaut).
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD", "/app/worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [net]

  # Supervision des files asynq (profil « dev ») : http://127.0.0.1:8090. Le mot de passe Redis
  # passe en argument (visible dans `docker inspect`) : réservé au développement local.
  asynqmon:
    image: ${ASYNQMON_IMAGE:-hibiken/asynqmon:0.7.2}
    profiles: [dev]
    restart: unless-stopped
    command:
      - --redis-addr=redis:6379
      - --redis-password=${REDIS_PASSWORD}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ASYNQMON_PORT:-8090}:8080"
    depends_on:
      redis: { condition: service_healthy }
    networks: [net]

  # Serveur SMTP de dev (profil « dev ») : capture tous les emails, interface web sur :8025.
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.31.4}
    profiles: [dev]
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "1000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${BIND_ADDR:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    # Healthcheck fourni par l'image (/mailpit readyz).
    networks: [net]

  # Outil ponctuel (jamais démarré par `up`) : osrm-extract / partition / customize.
  # Utilisé par scripts/osrm-prepare.sh via `docker compose run`.
  osrm-tools:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v26.10.0-debian}
    profiles: [tools]
    working_dir: /data
    network_mode: none
    volumes:
      - osrmdata:/data

volumes:
  pgdata:
  redisdata:
  osrmdata:
  documents:

networks:
  # Réseau dédié, scopé par projet : gostation_net.
  net:
    driver: bridge
