# Répétition locale de la production (docs/DEPLOY.md, « Répéter en local ») : ajouté par
# GOSTATION_EXTRA_COMPOSE=deploy/rehearsal.compose.yml à docker-compose.prod.yml. Jamais sur un
# serveur. DOMAIN=gostation.localhost : Caddy signe lui-même les certificats (*.localhost).
services:
  caddy:
    # Ports de l'hôte seulement sur la boucle locale.
    ports: !override
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"

  # SeaweedFS (service s3 de la production) sert aussi le dépôt restic de la répétition (bucket
  # gostation-backups), joint par restic sur le réseau net.
  s3:
    command: !override ["mini", "-dir=/data", "-bucket=gostation,gostation-backups", "-admin.ui=false", "-webdav=false"]
    networks: [storage, net]

  # Emails de l'API, du worker et de GlitchTip.
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.31.6}
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:18025:8025"
    networks: [net]
