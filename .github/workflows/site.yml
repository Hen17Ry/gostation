# Site public (Site/, Astro) : tokens générés à jour, lint, types, tests, build (CSP par empreintes),
# budget du JS initial, E2E Playwright sur le build (CSP, modes d'animation, accessibilité). Ne
# tourne que si Site/, la source des tokens ou ce fichier changent.
name: Site

on:
  push:
    paths:
      - "Site/**"
      - "Web/src/styles/globals.css"
      - "Web/src/lib/color.ts"
      - "Mobile/scripts/gen-map-styles.mts"
      - "Mobile/src/features/legal/markdown.ts"
      - "docs/legal/**"
      - "deploy/Caddyfile"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: Site

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  site:
    name: Lint, types, tests, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json
      - run: npm ci
      - name: Tokens à jour (Web/src/styles/globals.css)
        run: |
          npm run gen:tokens
          git diff --exit-code -- src || { echo "::error::tokens pas à jour : npm run gen:tokens"; exit 1; }
      - run: npm run lint
      - run: npm test
      - name: Build (astro check, CSP) et budget du JS initial (< 150 Ko gzip)
        run: npm run build && npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: Site/test-results
          retention-days: 7
