# Analyses de sécurité à chaque push : secrets dans tout l'historique (gitleaks), dépendances et
# image de l'API (trivy). Chaque lundi, les images tierces de la prod sont aussi relevées
# (rapport seulement : leurs failles non corrigées en amont sont suivies dans docs/security/scans.md).
name: Security

on:
  push:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.76.0

jobs:
  gitleaks:
    name: Secrets (gitleaks, tout l'historique)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Faux positifs ignorés par empreinte : .gitleaksignore.
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git --redact --no-banner .

  trivy:
    name: Dépendances et image de l'API (trivy)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Cache de la base trivy
        uses: actions/cache@v4
        with:
          path: .trivy-cache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      # Lockfiles (go.sum, package-lock.json) : échec sur toute faille HIGH ou CRITICAL corrigée en
      # amont (les autres sont justifiées dans docs/security/scans.md).
      - name: Dépendances
        run: >
          docker run --rm -v "$PWD:/src" -v "$PWD/.trivy-cache:/root/.cache" "$TRIVY_IMAGE"
          fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image de l'API
        uses: docker/build-push-action@v6
        with:
          context: Backend
          load: true
          tags: gostation-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image de l'API
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivy-cache:/root/.cache"
          "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 gostation-api:ci

  third-party-images:
    name: Images tierces (rapport)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgis/postgis:18-3.6
          - redis:8.10.2-alpine
          - ghcr.io/project-osrm/osrm-backend:v26.10.0-debian
          - caddy:2.11.7
          - glitchtip/glitchtip:6.2.6
          - restic/restic:0.19.1
          - rclone/rclone:1.75.2
    steps:
      - name: trivy ${{ matrix.image }}
        run: >
          docker run --rm "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 0 "${{ matrix.image }}"
